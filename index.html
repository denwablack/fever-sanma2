<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>フィーバー三麻</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box}*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#f4f1e6;font-family:system-ui,"Hiragino Sans",sans-serif;font-size:12px;overflow:hidden}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.felt{position:relative;height:100%;display:flex;flex-direction:column;gap:3px;padding:4px 8px;background-color:#1d5c3b;background-image:radial-gradient(#ffffff0d 1px,transparent 1.2px),radial-gradient(#0000001a 1px,transparent 1.2px);background-size:5px 5px,7px 7px;--rw:min(19px,4.7vh);--hw:min(calc((100vw - 60px)/14.9),10.6vh)}
.felt.menu{display:block;overflow:auto;padding:10px 18px;color:#fff;-webkit-overflow-scrolling:touch}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:8px 0}
@media (orientation:portrait){.g2{grid-template-columns:1fr}}
#rot{display:none;position:fixed;inset:0;background:#000e;z-index:99;color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:16px;text-align:center}
@media (orientation:portrait){#rot{display:flex}}#rot.off{display:none!important}
.hdr{display:flex;align-items:center;gap:6px;overflow:hidden;min-height:calc(var(--rw)*1.38 + 6px)}
.nkp{display:inline-flex;gap:5px;align-items:center;background:#0005;border-radius:4px;padding:2px 6px;white-space:nowrap}
.mid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:6px}
.wing,.ctr{background:#0003;border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.ctr{align-items:center}
.cbox{background:#0009;border-radius:6px;padding:3px 10px;text-align:center;line-height:1.5}
.pl{display:flex;align-items:center;gap:4px;background:#111c;color:#fff;border-radius:4px;padding:2px 5px;flex-wrap:wrap}
.pl b{font-size:14px}.pl small{font-size:8px;opacity:.7}
.wd{background:#fff2b8;color:#a01810;font-weight:800;padding:1px 3px;border-radius:2px}
.nb{background:#fff2b8;color:#222;padding:1px 3px;border-radius:2px}
.stk{display:inline-block;width:26px;height:5px;background:#fff;border:1px solid #c00;border-radius:2px}
.fev{color:#ffd54a;font-weight:800}
.strip{display:flex;gap:1px;flex-wrap:wrap}.strip i{display:block;width:9px;height:13px;background:linear-gradient(90deg,#fff,#e6e6da);border-bottom:2px solid #c8c8b8;border-radius:1px}
.riv,.mel{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;min-height:6px}
.ctr .riv{width:calc((var(--rw) + 2px)*6)}
.hdr .t,.rivgrid .t,.nkp .t,.cluster .meld3 .t{--w:var(--rw)}
.hdr .t b,.rivgrid .t b,.modal .t b{display:none}
.t{--w:26px;position:relative;display:inline-block;vertical-align:bottom;width:var(--w);height:calc(var(--w)*1.38);border-radius:3px;background:linear-gradient(#fff,#eeeee6);box-shadow:0 2px 0 #b5b5a8,0 3px 3px #0008;line-height:1;overflow:hidden;color:#222;flex-shrink:0}
.t .ti{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.t.tb .ti{display:none}
.t.m i{color:#c0392b}.t.p i{color:#1e6bb8}.t.s i{color:#1f8a3b}.t.z i{color:#111}
.t.rd{background:linear-gradient(#ffe0e0,#f2b3b3)}.t.gd{background:linear-gradient(#fff6bd,#e6c445)}.t.pt{background:linear-gradient(#e6f6ff,#a8d6f2)}.t.pt i{color:#0a5ea8}.t.rd i{color:#d00}.t.gd i{color:#8a5a00}
.t.tb{background:repeating-linear-gradient(135deg,#e8b060,#e8b060 3px,#c89038 3px,#c89038 6px);box-shadow:inset 0 0 0 1px #7a5010,0 2px 0 #7a5010,0 3px 3px #0008}
.hrow{display:flex;justify-content:center;padding:2px 0 5px}
.hand{display:flex;gap:1px;--w:var(--hw)}
.hand>.t{--w:var(--hw)}
.hand .meld3 .t{--w:var(--rw)}
.hand .t{cursor:pointer}
.hand .t.ok{transform:translateY(-8px);box-shadow:0 2px 0 #ffd54a,0 0 8px #ffd54a}
.hand .t.dim{opacity:.7}
.hand .gap{margin-left:10px}
.acts{position:absolute;right:10px;bottom:calc(var(--hw)*1.38 + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:55%;z-index:6}
.abtns{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.cm{display:flex}.cm .meld3 .t{--w:var(--rw)}
.cmo{justify-content:flex-end}
.cml,.cmr{position:absolute;top:calc(var(--rw)*1.38 + 24px);z-index:3}
.cml{left:8px;align-items:flex-start}.cmr{right:8px;align-items:flex-end}
.toast{position:absolute;left:10px;bottom:calc(var(--hw)*1.38 + 14px);width:30%;max-height:26vh;overflow:auto;background:#000a;border-radius:6px;padding:4px 7px;line-height:1.4;font-size:11px;z-index:5}
button{font-size:13px;padding:6px 10px;border:0;border-radius:8px;background:#ffd54a;color:#222;font-weight:700}
button.g{background:#ddd}button.r{background:#e74c3c;color:#fff}
.modal{position:absolute;inset:4px 5%;background:linear-gradient(#0f3a55,#0c2e44);border:1px solid #1f8fb7;border-radius:6px;z-index:20;display:flex;flex-direction:column;overflow:auto;color:#dfe9ef;font-size:10px}
.modal h3{margin:0;padding:2px 8px;background:#12557a;font-size:11px}
.mh{display:flex;align-items:flex-end;gap:1px;padding:3px 8px}.mh .t{--w:min(18px,4.2vh)}
.tulipsec{padding:1px 8px 2px}
.tulipflip{display:flex;gap:3px;perspective:400px;margin-top:2px}
.tulipflip .t{--w:min(18px,4.2vh);animation:tflip .5s ease-out both;transform-style:preserve-3d;position:relative}
.tulipflip .t.hit{box-shadow:0 0 10px 4px #ffd54a,0 2px 0 #b5b5a8,0 3px 3px #0008;animation:tflip .5s ease-out both,tpulse .8s ease-in-out .55s 2}
.tulipflip .t .tn{position:absolute;right:-3px;bottom:-3px;background:#e23;color:#fff;font-size:8px;font-style:normal;text-decoration:none;border-radius:7px;padding:0 3px;line-height:1.2;font-weight:bold;box-shadow:0 1px 2px #0008}
.tulipsec .sm1{opacity:0;animation:tfade .4s ease-out both}
@keyframes tflip{0%{transform:rotateY(100deg) scale(.4);opacity:0}60%{transform:rotateY(-15deg) scale(1.08);opacity:1}100%{transform:rotateY(0deg) scale(1);opacity:1}}
@keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes tfade{0%{opacity:0;transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;padding:0 8px}
.yr{display:flex;justify-content:space-between;border-bottom:1px solid #2a6a8a66;padding:0;font-size:10px;line-height:1.35}
.sm1{text-align:center;margin-top:1px;color:#8fe}
.dice{padding:1px 8px}
.chblock{margin-bottom:2px}
.chwhy{font-size:10px;font-weight:bold;opacity:.9;margin-bottom:1px}
.chrow{display:flex;align-items:center;gap:6px;font-size:10px;padding:0;opacity:0;animation:chin .3s ease-out both}
.chbowl{position:relative;width:58px;height:30px;flex:none;border-radius:50%;background:radial-gradient(ellipse at 50% 32%,#7a4426 0%,#512c15 55%,#2e1608 100%);box-shadow:inset 0 2px 5px #00000099,inset 0 -2px 3px #ffffff14,0 1px 2px #0007;display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.chbowl .d3{font-size:13px;display:inline-block;opacity:0;animation:droll .62s cubic-bezier(.34,1.4,.4,1) both;filter:drop-shadow(0 1px 1px #0008)}
.chlabel{opacity:0;animation:tfade .35s ease-out both}
.chrow.win .chlabel{color:#8f6;font-weight:bold}
.chrow.lose .chlabel{color:#f77}
.chrow.jp .chlabel{color:#ffd54a;font-weight:bold;text-shadow:0 0 6px #ffd54a88}
.chrow.jp .chbowl{animation:chglow 1s ease-in-out .5s 2}
.chrow.re .chlabel{opacity:.6!important;font-size:10px}
.chtotal{font-size:10px;font-weight:bold;padding:1px 2px 2px;opacity:0;animation:tfade .4s ease-out both;color:#ffd54a}
@keyframes chin{0%{opacity:0;transform:translateX(-6px)}100%{opacity:1;transform:translateX(0)}}
@keyframes droll{0%{opacity:0;transform:translate(0,-14px) rotate(0deg) scale(.7)}8%{opacity:1}28%{transform:translate(9px,5px) rotate(300deg) scale(.95)}48%{transform:translate(-11px,-5px) rotate(620deg) scale(1.08)}68%{transform:translate(6px,6px) rotate(860deg) scale(.96)}86%{transform:translate(-3px,-2px) rotate(1040deg) scale(1.05)}100%{opacity:1;transform:translate(0,0) rotate(1080deg) scale(1)}}
@keyframes chglow{0%,100%{box-shadow:inset 0 3px 6px #00000099,inset 0 -2px 3px #ffffff14,0 1px 2px #0007}50%{box-shadow:inset 0 3px 6px #00000099,inset 0 -2px 3px #ffffff14,0 0 10px 3px #ffd54a}}
table.sc{width:calc(100% - 16px);margin:2px 8px;border-collapse:collapse;font-size:10px}
table.sc td,table.sc th{padding:1px 3px;text-align:right;border-bottom:1px solid #2a6a8a44}
table.sc th{color:#8fb3c6;font-weight:400}table.sc td:first-child,table.sc th:first-child{text-align:left}
.pos{color:#5ee08a}.neg{color:#ff7a7a}
.mf{text-align:center;padding:2px}
.table{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.sq{position:relative;width:min(23vh,27vw);height:min(23vh,27vw);background:#0c1830;border:1px solid #3a5a8a;border-radius:8px;display:flex;flex-direction:column;z-index:2;padding:5px 6px;font-size:10px;color:#dfe9ef}
.sqr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a4a7a55;padding:1px 0}
.sqr b{color:#ffd54a}
.sqr.lead{color:#6cf}
.cluster{position:absolute;display:flex;gap:5px}
.rvrow{display:flex;align-items:center;gap:4px}
.cluster.top{bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;flex-direction:column;align-items:center}
.cluster.right{left:100%;top:6%;margin-left:22px;flex-direction:row;align-items:flex-start}
.name3.vr{writing-mode:vertical-rl}
.name3.vr .stk{width:5px;height:26px}
.cluster.bottom{top:100%;left:50%;transform:translateX(-50%);margin-top:8px;flex-direction:column;align-items:center}
.name3{font-size:10px;white-space:nowrap;flex:none}
.rivgrid{display:flex;gap:2px}
.rvline{display:flex;gap:2px}
.rivgrid.horiz{flex-direction:column}
.rivgrid.horiz .rvline{height:calc(var(--rw)*1.38);align-items:flex-end}
.rivgrid.vert{flex-direction:row;align-items:flex-start}
.rivgrid.vert .rvline{flex-direction:column-reverse;align-items:center;width:calc(var(--rw)*1.38)}
.rivgrid.horiz .t.rot{margin:0 calc(var(--rw)*.19);transform:translateY(calc(var(--rw)*.19)) rotate(90deg)}
.rivgrid.vert .t{transform:rotate(90deg);margin:calc(var(--rw)*-.19) 0}
.rivgrid.vert .t.rot{--w:var(--rw);transform:none;margin:0}
.riverwrap{position:relative}
.riverwrap.r180 .rivgrid{transform:rotate(180deg)}
.meld3{display:flex;gap:4px;flex:none}
.meld3 .t.rot{transform:rotate(90deg)}
.t.tb i,.t.tb b{visibility:hidden}
.meld3.rot180{transform:rotate(180deg)}
.meldR{width:calc(var(--rw)*1.38);height:calc(var(--rw)*var(--nt) + 2px*(var(--nt) - var(--ng)) + 4px*(var(--ng) - 1));display:flex;align-items:center;justify-content:center;flex:none}
.meldR .meld3{transform:rotate(-90deg)}
.meldgap{display:inline-block;width:7px;flex:none}
.callfx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:none;font-size:min(34vh,160px);font-weight:900;color:#ff3b30;-webkit-text-stroke:3px #fff;text-shadow:0 6px 18px #000c,0 0 30px #ffd54a;animation:callfx 1.5s ease-out both}
@keyframes callfx{0%{transform:translateX(-110%) scale(.6);opacity:0}25%{transform:translateX(0) scale(1.2);opacity:1}38%{transform:scale(1)}80%{transform:scale(1);opacity:1}100%{transform:translateX(110%) scale(1);opacity:0}}
</style></head><body><div id="app"></div><div id="rot"><div>📱 スマホを横向きにしてください</div><button onclick="this.parentNode.className='off'">このまま遊ぶ</button></div>

function lobby(){
 if(ROLE=='host')RM.emit('lobby',{});
 const o=G.opt||{rep:false,dora:1};
 $('app').innerHTML=`<div class="felt menu"><h2 style="margin:0">🎰 部屋 ${CODE}</h2><div class="g2"><div>
 ${ROLE=='host'?optsHtml(o)+`<button onclick="startGame('host')">この面子で対局開始（空席はCPU）</button>`:'ホストの開始を待っています…'}</div>
 <div><div id="lobbyList">${listHtml()}</div><br><button class="g" onclick="leaveRoom()">退出</button></div></div></div>`}
function leaveRoom(){try{RM&&RM.leave()}catch(e){}RM=null;ROLE='solo';SEATS={};if(TMR){clearInterval(TMR);TMR=null}G={opt:G.opt};V=0;menu()}
async function goOnline(role){
 NICK=clean($('nick').value)||'名無し';CODE=($('code').value||'1234').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,10)||'1234';
 const say=t=>{$('onmsg').textContent=t};let room=null;
 try{room=window.claude&&await window.claude.use('room')}catch(e){}
 if(!room){say('オンライン機能を利用できません（ログイン済みで、編集権限のある招待メンバーのみ利用できます）');return}
 try{RM=await room.join('sanma-'+CODE)}catch(e){RM=null;say('部屋に入れませんでした：'+((e&&e.code)||''));return}
 ROLE=role;RM.presence({role:role,nick:NICK});
 RM.onPeers(ch=>{if($('lobbyList'))$('lobbyList').innerHTML=listHtml();
  if(ROLE=='host'){ch.left.forEach(p=>{const s=SEATS[p.peer];if(s!=null&&G.hum&&G.hum[s])takeover(s)});if(ch.joined.length)LASTM=['','']}});
 if(role=='host'){
  RM.on('act',m=>{if(ROLE!='host'||!G.h)return;const s=SEATS[m.peer],d=m.data||{};if(s==null||typeof d.a!='string')return;act(s,d.a,d.x,d.p)});
  TMR=setInterval(()=>{LASTM=['',''];bcast()},3000)}
 else{
  RM.on('seat',m=>{const my=RM.peers().find(p=>p.isMe&&p.sameTab),mp=m.data&&m.data.map;if(my&&mp&&mp[my.peer]!=null)V=mp[my.peer]});
  [1,2].forEach(s=>{RM.on('st'+s,m=>{if(ROLE=='guest'&&V==s&&m.data)gApply(m.data)});RM.on('r'+s,m=>{if(V==s&&m.data){RES=m.data.r||null;if(G.h)draw()}});RM.on('m'+s,m=>{if(V==s&&m.data){msg=decM(m.data.m);DMSG=decM(m.data.d);if(G.h){G.dmsg=DMSG;draw()}}})});
  RM.on('lobby',()=>{G={opt:G.opt};V=-1;lobby()})}
 lobby()}
function startGame(mode){
 const o={rep:$('orep').checked,dora:+$('odora').value},hum=[1,0,0],names=[clean(NICK)||'あなた','CPU-A','CPU-B'];
 if(!RM||mode=='solo'){const n=$('nick');if(n)names[0]=clean(n.value)||'あなた';NICK=names[0]}
 SEATS={};V=0;
 if(mode=='host'&&RM){RM.peers().filter(p=>!p.isMe&&p.presence&&p.presence.role=='guest').slice(0,2).forEach((g,i)=>{hum[i+1]=1;names[i+1]=clean(g.presence.nick)||'ゲスト';SEATS[g.peer]=i+1});RM.emit('seat',{map:SEATS});setTimeout(()=>{LASTM=['',''];bcast()},500)}
 G={opt:o,pts:[35000,35000,35000],dealer:0,hn:1,honba:0,pot:0,chips:[0,0,0],used:[0,0,0],hum,names,over:false};newHand()}
menu();
</script></body></html>
